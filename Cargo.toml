[workspace]
resolver = "2"
members = [
    "crates/playback",
    "crates/decode",
    "crates/player-cli",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
cpal = "0.15"
symphonia = "0.5"
crossbeam-channel = "0.5"
anyhow = "1"
serde = "1"
parking_lot = "0.12"
serde_json = "1"
rayon = "1"
midir = "0.10"
qrcode = "0.14"
pinyin = "0.10"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tauri-plugin-global-shortcut = "2"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"

# 共享:统一版本,子 crate 用 workspace = true 引用
playback = { path = "crates/playback" }
decode = { path = "crates/decode" }

[profile.release]
lto = "thin"
